# Back-office Manager en conteneur.
#
#   docker compose up -d --build      -> http://localhost:8082
#
# L'API est relayee par nginx sous /api/ (meme adresse que l'app : pas de
# CORS). Par defaut vers le backend lance sur la machine
# (Backend_RestoApp : docker compose up, port 8080). Variables reglables
# dans un fichier .env a cote de ce fichier (voir .env.example, section
# Docker).
name: senyummies-manager

services:
  manager:
    build:
      context: .
      args:
        # Version affichee dans l'app (tag Git de la livraison, ex. v1.2.0).
        APP_VERSION: ${APP_VERSION:-}
    image: senyummies/manager:${IMAGE_TAG:-local}
    ports:
      - "${MANAGER_PORT:-8082}:8080"
    environment:
      API_BASE_URL: /api/v1
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
      SUPPORT_TELEPHONE: ${SUPPORT_TELEPHONE:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # Marque du restaurant (vide = SenYummies) : voir README, section Docker.
      # Pour un vrai restaurant : compose genere par l'outil de personnalisation
      # (Backend_RestoApp : npm run client -- <restaurant>).
      MARQUE_NOM: ${MARQUE_NOM:-}
      MARQUE_NOM_ACCENT: ${MARQUE_NOM_ACCENT:-}
      MARQUE_INITIALES: ${MARQUE_INITIALES:-}
      MARQUE_LOGO_URL: ${MARQUE_LOGO_URL:-}
      MARQUE_ETABLISSEMENT: ${MARQUE_ETABLISSEMENT:-}
      MARQUE_COULEUR: ${MARQUE_COULEUR:-}
      MARQUE_COULEUR_CLAIRE: ${MARQUE_COULEUR_CLAIRE:-}
      MARQUE_CONNEXION_IMAGES: ${MARQUE_CONNEXION_IMAGES:-}
      MARQUE_PAIEMENTS: ${MARQUE_PAIEMENTS:-}
      MARQUE_ADRESSE: ${MARQUE_ADRESSE:-}
      MARQUE_TELEPHONE: ${MARQUE_TELEPHONE:-}
    # Logo du restaurant (facultatif) : decommenter.
    # volumes:
    #   - ./marque:/marque:ro
    extra_hosts:
      # host.docker.internal aussi sous Linux (backend lance sur la machine).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
