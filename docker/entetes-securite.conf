# En-tetes de securite HTTP, inclus dans le bloc server ET dans chaque
# location qui definit ses propres add_header (sinon nginx ne les herite pas).
#
# CSP : scripts uniquement servis par l'app (aucun script inline, ni eval) ;
# styles inline autorises (React, graphiques, scanner QR) ; Font Awesome sur
# cdnjs (avec SRI) ; images https (photos produits, drapeaux du champ
# telephone) ; API sur la meme origine (/api/ relaye par nginx) ; blob: en
# lecture pour envoyer au serveur la photo recadree dans le navigateur.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Camera pour le scan QR du Livreur ; le reste coupe.
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
